# Explicit PID file for Docker environment
pid /var/run/nginx.pid;

user root;
events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Real client IP: Coolify's Traefik (on 10.0.1.0/24) overwrites X-Forwarded-For
    # with the actual client address, so trust it for $remote_addr in the logs.
    set_real_ip_from 10.0.1.0/24;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # send logs to stdout/stderr for Docker
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Cache configuration for auth requests
    proxy_cache_path /var/cache/nginx/auth_cache levels=1:2 keys_zone=auth_cache:10m max_size=10m inactive=60m use_temp_path=off;

    server {
        listen 80;

        # Health check
        location = /health {
            access_log off;
            return 200 "healthy\n";
        }

        # Dotfile probes (/.env, /.git/config, ...) get a clear 404 instead of the SPA page
        location ~ /\.(?!well-known/) {
            return 404;
        }

        # Flask API (Bedrock chat, dashboard brief, auth)
        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            
            # Longer timeouts for LLM responses (can take 120+ seconds)
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            
            # SSE (Server-Sent Events) support for streaming chat
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        # Video Streaming from M3 (via Tunnel)
        location /video/ {
            # Use 10.0.0.1 (Docker Bridge/vpn IP) matching Ollama config
            proxy_pass http://10.0.0.1:8888/;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "keep-alive";
        }

        # Dashboard (Static Site)
        location / {
            root /app/dashboard;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # AI David lives in the homepage widget; the old full page just goes home.
        # Exact match only: /david/david.js, david.css and frames/ are still served.
        location = /david/ {
            absolute_redirect off;
            return 302 /;
        }

        # Retired MCP Agent Lab (2026-09-27): send old links home
        location /lab/ {
            absolute_redirect off;   # plain "Location: /" so the browser stays on https
            return 302 /;
        }

        # ESC Family History Explorer (Streamlit)
        location /esc/ {
            proxy_pass http://127.0.0.1:8502/esc/;
            # AI David's "Ask" bubble on the ESC page (as its how-to guide): inject the loader into
            # Streamlit's HTML. sub_filter needs the upstream response uncompressed.
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<script src="/david/widget.js?v=4" data-context="esc" defer></script></head>';
            sub_filter_once on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # WebSocket support for Streamlit
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # ESC API — Trip Map viewer (browser-accessible, proxied from M3 via tunnel)
        location /esc/map/ {
            proxy_pass http://10.0.0.1:8002/map/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # ESC API — 3D Terrain viewer (proxied from M3 via tunnel)
        location /esc/map3d/ {
            proxy_pass http://10.0.0.1:8002/map3d/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # ESC API — Family Tree viewer (browser-accessible, proxied from M3 via tunnel)
        location /esc/family/ {
            proxy_pass http://10.0.0.1:8002/family/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # ESC API — Image serving under /esc/ so the family sign-in cookie (path=/esc)
        # is sent; the API checks it. Map pages load photos from here.
        location /esc/image/ {
            proxy_pass http://10.0.0.1:8002/image/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
            add_header Cache-Control "private, max-age=86400";
        }

        # ESC API — old image path, kept for a week for cached map pages (also protected)
        location /image/ {
            proxy_pass http://10.0.0.1:8002/image/;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
            add_header Cache-Control "public, max-age=86400";
        }

        # ESC Streamlit static assets
        location /esc/static {
            proxy_pass http://127.0.0.1:8502/esc/static;
        }
        location /esc/healthz {
            proxy_pass http://127.0.0.1:8502/esc/healthz;
        }
        location /esc/vendor {
            proxy_pass http://127.0.0.1:8502/esc/vendor;
        }
        location /esc/stream {
            proxy_pass http://127.0.0.1:8502/esc/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Bedrock Insurance Demo (Strictly proxied if part of app, or served statically?)
        # Since we removed complexity, assuming everything is inside Streamlit now or 
        # distinct apps need specific routes.
        # Keeping existingBedrock structure if it was separate, but user said "wipe out".
        # If Bedrock was a separate static site, it might break. 
        # But previous config had /bedrock assigned to /app/dashboard/bedrock.
        # I should probably keep static asset serving for that if needed, 
        # BUT the plan was "Wipe it out".
        # I will keep the Bedrock route just in case, served statically, but NO AUTH on Nginx.
        # Actually, let's keep it simple as requested. If they need it back, we add it. 
        # VoxSure Forensic Audit Tool
        location /audit/ {
            alias /app/voxsure/app/;
            index index.html;
            try_files $uri $uri/ /audit/index.html;
        }

        location /audit/api/ {
            # Rewrite /audit/api/ to / for the FastAPI backend
            rewrite ^/audit/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:12346;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

    }
}
