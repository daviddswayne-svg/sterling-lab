<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seattle Center — Voxel</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div class="panel">
    <div class="title">Seattle Center <span>voxel v5 · milestone A</span></div>
    <label>Sun <input id="sun" type="range" min="4" max="85" value="38" /></label>
    <label>Azimuth <input id="azimuth" type="range" min="0" max="360" value="155" /></label>
    <div class="row"><span id="mode">ORBIT (F)</span><span class="hint">drag · scroll · F to fly (WASD QE, shift)</span></div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
